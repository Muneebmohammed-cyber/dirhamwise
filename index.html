<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DirhamWise</title>
<meta name="description" content="Personal finance and budgeting for the UAE">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0E17">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DirhamWise">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>window.__PWA__=true;</script>
<script src="lib/chart.umd.js"></script>
<style>:root{--bg:#0A0E17;--bg2:#0F1522;--card:#131A2A;--card2:#182136;--line:#223049;--text:#E8EDF7;--mut:#8A97B1;--mut2:#5E6B85;--acc:#7C6CFF;--acc2:#22D3EE;--good:#22C55E;--warn:#F59E0B;--bad:#F43F5E;--info:#38BDF8;--shadow:0 10px 30px rgba(0,0,0,.35);--r:16px;--grad:linear-gradient(135deg,#7C6CFF 0%,#22D3EE 100%)}
[data-theme=light]{--bg:#F4F6FB;--bg2:#EEF1F8;--card:#FFFFFF;--card2:#F7F8FC;--line:#E3E8F2;--text:#111827;--mut:#5B6781;--mut2:#94A0B8;--shadow:0 8px 24px rgba(17,24,39,.07)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc2)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--mut);text-decoration:none;cursor:pointer;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--card);color:var(--text)}.nav.on{background:var(--card2);color:var(--text);box-shadow:inset 3px 0 0 var(--acc)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.sidefoot{margin-top:auto;font-size:12px;color:var(--mut2);padding:10px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 26px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.top .sp{flex:1}
.mpick{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.mpick button{border:0;background:none;padding:6px 9px;cursor:pointer;color:var(--mut);border-radius:8px}.mpick button:hover{background:var(--card2);color:var(--text)}
.mpick span{min-width:84px;text-align:center;font-weight:600;font-size:13px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--good)}.pill.loc{color:var(--warn)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--text)}
.icon-btn svg{width:18px;height:18px}.icon-btn .dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--card2)}.btn.pri{background:var(--grad);border:0;color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn.ghost{background:none;border-color:transparent;color:var(--mut)}.btn.ghost:hover{color:var(--text);background:var(--card2)}
.btn.danger{color:var(--bad)}
.content{padding:22px 26px 110px;max-width:1440px;width:100%}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:14px}.ph h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}.ph .sp{flex:1}.ph small{color:var(--mut)}
.kpi{padding:16px}.kpi .l{color:var(--mut);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}.kpi .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.kpi .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px}
.hero{background:radial-gradient(120% 140% at 0% 0%,rgba(124,108,255,.35),transparent 55%),radial-gradient(120% 140% at 100% 100%,rgba(34,211,238,.22),transparent 55%),var(--card)}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:6px 0}
.up{color:var(--good)}.down{color:var(--bad)}.mut{color:var(--mut)}.warnc{color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.bar.ok>i{background:var(--good)}.bar.warn>i{background:var(--warn)}.bar.over>i{background:var(--bad)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{color:var(--mut);font-size:12px}
.row .amt{font-weight:650;white-space:nowrap;text-align:right}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:16px;background:var(--card2);border:1px solid var(--line)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}.tag.info{color:var(--info)}
.chart{position:relative;height:250px}.chart.sm{height:200px}.chart.lg{height:300px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px;overflow:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap;font-size:13px}.tabs button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 var(--line)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.inp,select.inp,textarea.inp{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;width:100%;min-width:0}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.toolbar .inp{width:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl tr:last-child td{border-bottom:0}.tbl .r{text-align:right}
.scroll-x{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--mut)}
.ins{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;line-height:1.45}.ins i{font-style:normal;flex:none}
.ccard{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ccard::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.ccard .bk{font-size:12px;opacity:.85;font-weight:600;letter-spacing:.04em;text-transform:uppercase}.ccard .nm{font-weight:700;font-size:16px}.ccard .bal{font-size:24px;font-weight:800;margin-top:auto;letter-spacing:-.02em}
.ccard .meta{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-top:6px}
.ring{--p:0;--c:var(--acc);width:var(--sz,88px);height:var(--sz,88px);border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:calc(100% - 14px);height:calc(100% - 14px);border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px}
.ring small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.stat{display:flex;flex-direction:column;gap:2px}.stat span{color:var(--mut);font-size:12px}.stat b{font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,8,15,.6);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .18s}
.modal.wide{max-width:860px}
.mh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}.mh h3{margin:0;font-size:16px;flex:1}
.mb{padding:18px}.mf{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}.mf .sp{flex:1}
.fld{margin-bottom:13px}.fld label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}.fld .hint{font-size:11px;color:var(--mut2);margin-top:4px}
.fld.err .inp{border-color:var(--bad)}.fld .em{color:var(--bad);font-size:12px;margin-top:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;color:var(--text)!important}.chk input{width:18px;height:18px;accent-color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--line);background:var(--bg2);padding:7px 11px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12px;color:var(--mut)}.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--good);padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);animation:pop .2s;font-size:13px;line-height:1.4}
.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}.toast.info{border-left-color:var(--info)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto;padding:4px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;line-height:1.5;white-space:pre-wrap}.msg.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}.msg.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--card2);padding:6px 11px;border-radius:99px;cursor:pointer;font-size:12px;font-weight:500}.chip:hover{border-color:var(--acc)}
.bnav,.fab,.mtitle{display:none}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:300}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:spin 0.8s linear infinite;margin:0 auto 14px}
.onb{max-width:560px;margin:8vh auto;text-align:center;padding:20px}.onb h2{font-size:28px;letter-spacing:-.02em;margin:18px 0 8px}.onb p{color:var(--mut);line-height:1.6}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:10px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}@keyframes fade{from{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}.side{display:none}
 .top{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}.top h1{font-size:17px}.top .hide-m{display:none}
 .content{padding:14px 12px 120px}
 .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:auto}
 .grid{gap:12px}.panel{padding:14px;border-radius:14px}.kpi{padding:13px}.kpi .v{font-size:18px}.hero .big{font-size:30px}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);padding:5px 0;cursor:pointer;font-weight:600}.bnav button.on{color:var(--acc)}.bnav svg{width:21px;height:21px}
 .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;background:var(--grad);color:#fff;border:0;font-size:28px;z-index:41;box-shadow:0 10px 30px rgba(124,108,255,.5);cursor:pointer}
 .scrim{place-items:end center;padding:0}.modal{border-radius:22px 22px 0 0;max-height:94vh;max-width:none}
 .frow{grid-template-columns:1fr}.toasts{left:12px;right:12px;top:auto;bottom:calc(86px + env(safe-area-inset-bottom));max-width:none}
 .chart{height:220px}.tbl{font-size:12px}
}
@media (max-width:420px){.mpick span{min-width:64px;font-size:12px}.top .pill{display:none}}

/* ================= Motion & polish layer ================= */
@property --p { syntax:'<number>'; inherits:false; initial-value:0; }
@property --a { syntax:'<angle>'; inherits:false; initial-value:0deg; }
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--glass:rgba(19,26,42,.72);--hl:rgba(255,255,255,.05)}
[data-theme=light]{--glass:rgba(255,255,255,.78);--hl:rgba(255,255,255,.9)}
body{transition:background-color .35s,color .35s;background:var(--bg)}
/* ambient aurora background */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 15%,rgba(124,108,255,.22),transparent 70%),radial-gradient(35% 30% at 85% 25%,rgba(34,211,238,.16),transparent 70%),radial-gradient(45% 40% at 60% 90%,rgba(244,63,94,.10),transparent 70%);
  filter:blur(10px);animation:aurora 26s ease-in-out infinite alternate}
[data-theme=light] body::before{opacity:.55}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-4%,3%,0) rotate(8deg)}100%{transform:translate3d(3%,-3%,0) rotate(-6deg)}}
.app,.main{background:transparent}.side{background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:blur(16px)}
/* glass panels */
.panel{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff 4%),var(--glass));backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:var(--shadow),inset 0 1px 0 var(--hl);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
@media (hover:hover){.panel:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 35%,var(--line));box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 var(--hl)}}
.kpi .ic{transition:transform .5s var(--spring)}.kpi:hover .ic{transform:rotate(-10deg) scale(1.15)}
/* hero with sweeping light + animated gradient border */
.hero{position:relative;overflow:hidden;border:1px solid transparent;background:radial-gradient(120% 140% at 0% 0%,rgba(124,108,255,.38),transparent 55%),radial-gradient(120% 140% at 100% 100%,rgba(34,211,238,.24),transparent 55%),linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--a),#7C6CFF,#22D3EE,#F43F5E,#7C6CFF) border-box;animation:spinA 8s linear infinite}
@keyframes spinA{to{--a:360deg}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.10) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 7s var(--ease) 1.2s infinite;pointer-events:none}
@keyframes sweep{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.hero .big{background:linear-gradient(90deg,var(--text),#c4bcff,var(--acc2),var(--text));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
/* page entrance: staggered rise */
.view-enter>*,.view-enter>.grid>*,.view-enter .grid>.panel,.view-enter .list>.row{animation:rise .6s var(--ease) both}
.view-enter>*:nth-child(2),.view-enter .grid>*:nth-child(2),.view-enter .list>.row:nth-child(2){animation-delay:.05s}
.view-enter>*:nth-child(3),.view-enter .grid>*:nth-child(3),.view-enter .list>.row:nth-child(3){animation-delay:.1s}
.view-enter>*:nth-child(4),.view-enter .grid>*:nth-child(4),.view-enter .list>.row:nth-child(4){animation-delay:.15s}
.view-enter>*:nth-child(5),.view-enter .grid>*:nth-child(5),.view-enter .list>.row:nth-child(5){animation-delay:.2s}
.view-enter>*:nth-child(6),.view-enter .grid>*:nth-child(6),.view-enter .list>.row:nth-child(6){animation-delay:.25s}
.view-enter>*:nth-child(7),.view-enter .grid>*:nth-child(7),.view-enter .list>.row:nth-child(7){animation-delay:.3s}
.view-enter>*:nth-child(n+8),.view-enter .grid>*:nth-child(n+8),.view-enter .list>.row:nth-child(n+8){animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
/* bars & rings animate in */
.view-enter .bar>i{animation:grow 1.1s var(--ease) .25s both;transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}}
.bar>i{position:relative;overflow:hidden}.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:barshine 3.2s ease-in-out 1.4s infinite}
@keyframes barshine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ring{transition:--p 1.4s var(--ease);box-shadow:0 0 30px color-mix(in srgb,var(--c) 35%,transparent)}
.ring>div{box-shadow:inset 0 2px 10px rgba(0,0,0,.25)}
/* list rows */
.row{transition:background .2s,transform .2s;border-radius:12px}
.row[data-act]:hover{background:var(--card2);transform:translateX(3px)}
.av{transition:transform .4s var(--spring)}.row:hover .av{transform:scale(1.08) rotate(-4deg)}
/* buttons: press + ripple */
.btn,.chip,.nav,.bnav button,.icon-btn,.tabs button,.seg button{position:relative;overflow:hidden;transition:transform .15s var(--ease),background .2s,box-shadow .25s,filter .2s}
.btn:active,.chip:active,.icon-btn:active,.seg button:active{transform:scale(.96)}

<script>/* ===== Finance engine: pure logic, no DOM ===== */
const EXP_CATS = ['Rent & Housing','Groceries','Restaurants & Dining','Transportation','Fuel','Salik & Darb','Electricity & Water','Internet & Mobile','Shopping','Healthcare','Family','Education','Entertainment','Travel','Subscriptions','Loan EMI','Bank Fees','Other'];
const INC_CATS = ['Salary','Bonus','Commission','Freelance','Rental Income','Dividends','Refund','Other Income'];
const DISCRETIONARY = ['Restaurants & Dining','Shopping','Entertainment','Travel','Subscriptions'];
const METHODS = ['Bank transfer','Debit card','Credit card','Cash','Apple Pay','Cheque','Direct debit'];
const ASSET_CLASSES = ['US Stock','UAE Stock','ETF','Gold','Silver','Cash Investment','Other'];
const TX_TYPES = {
  expense:'Expense', income:'Income', transfer:'Transfer', card_payment:'Card payment',
  loan_payment:'Loan EMI', goal_contribution:'Goal contribution', goal_withdraw:'Goal withdrawal',
  invest_buy:'Investment buy', invest_sell:'Investment sell'
};
const CURRENCIES = { AED:'AED', USD:'$', EUR:'€', GBP:'£', SAR:'SAR', INR:'₹', PKR:'Rs', PHP:'₱' };
const DEFAULT_RATES = { AED:1, USD:3.6725, EUR:4.25, GBP:4.85, SAR:0.979, INR:0.0425, PKR:0.0131, PHP:0.064 };

const p2 = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
let _today = null;
const todayISO = () => _today || iso(new Date());
const setToday = s => { _today = s; };
const addMonths = (s, n) => { const d = parseD(s), day = d.getDate(); const t = new Date(d.getFullYear(), d.getMonth()+n, 1); const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return iso(t); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const ymOf = s => s.slice(0,7);
const ymAdd = (ym, n) => addMonths(ym+'-01', n).slice(0,7);
const ymLabel = ym => new Date(+ym.slice(0,4), +ym.slice(5)-1, 1).toLocaleDateString('en-GB',{month:'short', year:'2-digit'});
const ymLong = ym => new Date(+ym.slice(0,4), +ym.slice(5)-1, 1).toLocaleDateString('en-GB',{month:'long', year:'numeric'});
const dateOn = (ym, day) => { const last = new Date(+ym.slice(0,4), +ym.slice(5), 0).getDate(); return `${ym}-${p2(Math.min(day,last))}`; };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const sum = arr => arr.reduce((a,b) => a + (+b||0), 0);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function emptyState() {
  return {
    v: 1,
    settings: { cycleDay:1, currency:'AED', symbol:'AED', rates:{...DEFAULT_RATES}, theme:'auto', hijri:true, islamicEvents:true, remindDays:5, salaryDay:28, name:'' },
    accounts: [], cards: [], loans: [], goals: [], assets: [], budgets: {}, bills: [], subs: [], merchantMap: {}, smsSeen: [], tx: []
  };
}

/* ---- rate helpers (rates = AED per 1 unit of currency) ---- */
const rateOf = (S, c) => +(S.settings.rates[c] || DEFAULT_RATES[c] || 1);

/* ---- EMI & amortization ---- */
function emi(P, annualRate, n) {
  P = +P; n = +n; const r = +annualRate / 1200;
  if (!(P > 0) || !(n > 0)) return 0;
  if (r === 0) return P / n;
  return P * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
}
function flatEmi(P, flatRate, n) { return (P + P * flatRate/100 * n/12) / n; }
function flatToReducing(P, flatRate, n) { // solve reducing rate giving same EMI
  const target = flatEmi(P, flatRate, n); let lo = 0, hi = 100;
  for (let i=0; i<80; i++) { const mid = (lo+hi)/2; if (emi(P, mid, n) > target) hi = mid; else lo = mid; }
  return (lo+hi)/2;
}
function amortize(balance, annualRate, payment, extra = 0, startISO = null, maxN = 600) {
  const r = annualRate / 1200; const rows = []; let bal = +balance, totalInt = 0, n = 0;
  const pay = +payment + (+extra||0);
  if (pay <= bal * r && bal > 0) return { rows, months: Infinity, totalInterest: Infinity, never: true };
  let date = startISO;
  while (bal > 0.005 && n < maxN) {
    const interest = bal * r; let principal = Math.min(pay - interest, bal); const p = principal + interest;
    bal -= principal; totalInt += interest; n++;
    rows.push({ n, date, payment: p, principal, interest, balance: Math.max(0, bal) });
    if (date) date = addMonths(date, 1);
  }
  return { rows, months: n, totalInterest: totalInt, endDate: rows.length ? rows[rows.length-1].date : startISO };
}
function remainingMonths(bal, rate, pay) { const a = amortize(bal, rate, pay); return a.months; }

/* ---- Recurring generation (monthly / quarterly / yearly) ---- */
function generateRecurring(S) {
  const today = todayISO(); let created = 0;
  const step = { monthly:1, quarterly:3, yearly:12 };
  const byParent = {};
  for (const t of S.tx) if (t.parent) (byParent[t.parent] ||= new Set()).add(t.date);
  for (const t of [...S.tx]) {
    if (!t.recurring || t.parent || !step[t.recurring]) continue;
    const have = byParent[t.id] || new Set(); const skip = new Set(t.skip || []);
    for (let k = 1; k < 240; k++) {
      const d = addMonths(t.date, k * step[t.recurring]);
      if (d > today) break;
      if (t.until && d > t.until) break;
      if (have.has(d) || skip.has(d)) continue;
      const c = { ...t, id: uid(), date: d, parent: t.id, recurring: null, skip: undefined, attachment: null, auto: true };
      delete c.skip; S.tx.push(c); created++;
    }
  }
  return created;
}

/* ---- Subscriptions ---- */
const SUB_PRESETS = [
  ['Netflix','🎬','Subscriptions','monthly'],['Amazon Prime','📦','Subscriptions','monthly'],['noon One','🟡','Subscriptions','monthly'],['Careem Plus','🟢','Subscriptions','monthly'],
  ['Talabat Pro','🍔','Subscriptions','monthly'],['Deliveroo Plus','🛵','Subscriptions','monthly'],['Spotify','🎵','Subscriptions','monthly'],['Anghami','🎧','Subscriptions','monthly'],
  ['YouTube Premium','▶️','Subscriptions','monthly'],['Apple iCloud+ / One','🍎','Subscriptions','monthly'],['Google One','☁️','Subscriptions','monthly'],['Shahid VIP','📺','Subscriptions','monthly'],
  ['OSN+','📺','Subscriptions','monthly'],['Disney+','✨','Subscriptions','monthly'],['ChatGPT Plus','🤖','Subscriptions','monthly'],['Claude Pro','🧠','Subscriptions','monthly'],
  ['Microsoft 365','🗂️','Subscriptions','yearly'],['LinkedIn Premium','💼','Subscriptions','monthly'],['Gym membership','🏋️','Healthcare','monthly'],['Mobile plan (du / e&)','📶','Internet & Mobile','monthly'],
  ['Home internet','🌐','Internet & Mobile','monthly'],['Car insurance','🚗','Transportation','yearly'],['Other','🔁','Subscriptions','monthly']
];
const SUB_STEP = { weekly: 0, monthly: 1, quarterly: 3, yearly: 12 };
function subAdvance(d, cycle) { return cycle === 'weekly' ? addDays(d, 7) : addMonths(d, SUB_STEP[cycle] || 1); }
function subAED(S, sub) { return r2((+sub.amount || 0) * rateOf(S, sub.currency || 'AED')); }
function subMonthly(S, sub) { const a = subAED(S, sub); return sub.cycle === 'weekly' ? a * 52 / 12 : sub.cycle === 'yearly' ? a / 12 : sub.cycle === 'quarterly' ? a / 3 : a; }
const subActive = sub => (sub.status || 'active') === 'active';
// On or after each charge date: auto-record an expense (if enabled) and roll the next date forward.
function generateSubs(S) {
  const today = todayISO(); let n = 0;
  for (const sub of S.subs || []) {
    if (!subActive(sub) || !sub.next) continue;
    let guard = 0;
    while (sub.next <= today && guard++ < 400) {
      if (sub.trialEnd && sub.next <= sub.trialEnd) { sub.next = addDays(sub.trialEnd, 1); continue; }
      if (sub.auto === false) break; // manual: stays due until marked paid
      const key = sub.name.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);
      const already = S.tx.find(t => t.source === 'sms' && !t.subId && t.type === 'expense' && Math.abs(daysBetween(t.date, sub.next)) <= 3 && (sub.cardId ? t.cardId === sub.cardId : t.accountId === sub.accountId) && (t.payee || '').toLowerCase().replace(/[^a-z0-9]/g, '').includes(key));
      if (already) { already.subId = sub.id; already.smsConfirmed = true; sub.last = sub.next; sub.next = subAdvance(sub.next, sub.cycle); continue; }
      const t = { id: uid(), created: Date.now() + n, type:'expense', date: sub.next, amount: subAED(S, sub), category: sub.category || 'Subscriptions', payee: sub.name, method: sub.cardId ? 'Credit card' : 'Direct debit', subId: sub.id, auto: true };
      if (sub.cardId) t.cardId = sub.cardId; else t.accountId = sub.accountId;
      S.tx.push(t); n++; sub.last = sub.next; sub.next = subAdvance(sub.next, sub.cycle);
    }
  }
  return n;
}
function chargesBetween(sub, from, to) { // dates of charges in [from, to]
  const out = []; if (!subActive(sub) || !sub.next) return out; let d = sub.next, g = 0;
  while (d <= to && g++ < 200) { if (d >= from && !(sub.trialEnd && d <= sub.trialEnd)) out.push(d); d = subAdvance(d, sub.cycle); }
  return out;
}
function subWarnings(S, L, days = 30) {
  const today = todayISO(), end = addDays(today, days), out = [];
  const active = (S.subs || []).filter(subActive);
  const payer = sub => sub.cardId ? (S.cards.find(c => c.id === sub.cardId)) : null;
  for (const c of S.cards) {
    const mine = active.filter(s => s.cardId === c.id); if (!mine.length) continue;
    const ci = cardInfo(S, L, c);
    const upcoming = sum(mine.flatMap(s => chargesBetween(s, today, end).map(() => subAED(S, s))));
    if (upcoming > 0 && upcoming > ci.available) out.push({ level:'bad', cardId:c.id, text:`${c.bank} ${c.name}: ${fmtPlain(upcoming)} of subscriptions due in ${days} days but only ${fmtPlain(Math.max(0, ci.available))} credit is available. Charges may be declined.` });
    else if (upcoming > 0 && ci.limit && (Math.max(0, ci.bal) + upcoming) / ci.limit > 0.9) out.push({ level:'warn', cardId:c.id, text:`${c.bank} ${c.name}: upcoming subscriptions will push the card above 90% of its limit.` });
    if (c.expiry) { const expEnd = dateOn(c.expiry, 31);
      const hit = mine.filter(s => chargesBetween(s, addDays(expEnd, 1), addDays(expEnd, 400)).length && daysBetween(today, expEnd) <= 60);
      if (daysBetween(today, expEnd) < 0) out.push({ level:'bad', cardId:c.id, text:`${c.bank} ${c.name} expired (${c.expiry}). Update the card on: ${mine.map(s => s.name).join(', ')}.` });
      else if (hit.length) out.push({ level:'warn', cardId:c.id, text:`${c.bank} ${c.name} expires ${c.expiry}. Update the new card details on: ${hit.map(s => s.name).join(', ')}.` }); }
  }
  for (const c of S.cards) { if (!c.bankAvail) continue; const lim = +c.limit || 0;
    if (c.bankAvail.amount < Math.max(1000, lim * 0.1)) out.push({ level: c.bankAvail.amount < 300 ? 'bad' : 'warn', cardId:c.id, text:`${c.bank} ${c.name}: your bank reported only ${fmtPlain(c.bankAvail.amount)} available credit on ${c.bankAvail.date}. Larger purchases or renewals may be declined.` }); }
  for (const s of active) {
    const p = payer(s);
    if (s.cardId && !p) out.push({ level:'bad', subId:s.id, text:`${s.name} is linked to a card that no longer exists. Edit it and choose a payment card.` });
    if (s.trialEnd && s.trialEnd >= today && daysBetween(today, s.trialEnd) <= 7) out.push({ level:'warn', subId:s.id, cardId:s.cardId, text:`${s.name} free trial ends ${s.trialEnd}. You'll be charged ${fmtPlain(subAED(S, s))} after that unless you cancel.` });
    if (s.cycle === 'yearly' && s.next && daysBetween(today, s.next) >= 0 && daysBetween(today, s.next) <= 30) out.push({ level:'warn', subId:s.id, cardId:s.cardId, text:`${s.name} renews for a full year on ${s.next}: ${fmtPlain(subAED(S, s))}${p ? ' on ' + p.bank + ' ' + p.name : ''}.` });
    if (s.auto === false && s.next && s.next < today) out.push({ level:'bad', subId:s.id, cardId:s.cardId, text:`${s.name} was due ${s.next} and hasn't been marked as paid.` });
  }
  const names = {}; for (const s of active) { const k = s.name.toLowerCase().replace(/[^a-z0-9]/g, ''); (names[k] ||= []).push(s); }
  for (const list of Object.values(names)) if (list.length > 1) out.push({ level:'warn', subId:list[0].id, text:`You have ${list.length} active ${list[0].name} subscriptions. Is one a duplicate?` });
  // price change: last auto-recorded charge vs current amount
  for (const s of active) { const last = S.tx.filter(t => t.subId === s.id).sort((a,b) => b.date.localeCompare(a.date))[0];
    if (last && Math.abs(last.amount - subAED(S, s)) > 0.5 && !last.auto) out.push({ level:'info', subId:s.id, text:`${s.name}: last charge was ${fmtPlain(last.amount)}, now set to ${fmtPlain(subAED(S, s))}.` }); }
  const rank = { bad:0, warn:1, info:2 }; return out.sort((a,b) => rank[a.level] - rank[b.level]);
}
const fmtPlain = v => 'AED ' + (+v).toLocaleString('en-US', { maximumFractionDigits: v >= 1000 ? 0 : 2 });

/* ---- Ledger: balances as of a date ---- */
function ledger(S, upTo = null) {
  upTo = upTo || todayISO(); // future-dated (scheduled) transactions don't change today's balances
  const acc = {}, card = {}, cashback = {}, loan = {}, loanInt = {}, goal = {}, hold = {};
  const meta = { acc:{}, card:{}, loan:{}, goal:{} };
  for (const a of S.accounts) { acc[a.id] = +a.opening||0; meta.acc[a.id] = a.asOf || '0000-01-01'; }
  for (const c of S.cards) { card[c.id] = +c.opening||0; cashback[c.id] = 0; meta.card[c.id] = c.asOf || '0000-01-01'; }
  for (const l of S.loans) { loan[l.id] = +l.outstanding||0; loanInt[l.id] = 0; meta.loan[l.id] = l.asOf || '0000-01-01'; }
  for (const g of S.goals) { goal[g.id] = +g.opening||0; meta.goal[g.id] = g.asOf || '0000-01-01'; }
  for (const a of S.assets) hold[a.id] = { qty:0, costAED:0, costCcy:0, realized:0, buys:0, sells:0, history:[] };
  const txs = S.tx.filter(t => t.date <= upTo).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created||0)-(b.created||0));
  const A = (id, d, v) => { if (id in acc && d >= meta.acc[id]) acc[id] += v; };
  const interestByTx = {};
  for (const t of txs) {
    const amt = +t.amount || 0, d = t.date;
    switch (t.type) {
      case 'income': A(t.accountId, d, amt); break;
      case 'expense':
        if (t.cardId && t.cardId in card) { if (d >= meta.card[t.cardId]) card[t.cardId] += amt; const c = S.cards.find(x=>x.id===t.cardId); cashback[t.cardId] += amt * (+c.cashback||0)/100; }
        else A(t.accountId, d, -amt);
        break;

/* ---- Budgets ---- */

/* ---- Cards ---- */

/* ---- Reminders ---- */

/* ---- Debt-to-income, health score ---- */

/* ---- Insights (rule-based, only from recorded data) ---- */

/* ---- Reports ---- */

function buildReport(S, kind, key, fmtN) {
  const P = periodBounds(kind, key); const agg = periodAgg(S, P.from, P.to); const end = P.to < todayISO() ? P.to : todayISO();
  const L = ledger(S, end), Lstart = ledger(S, addDays(P.from, -1));
  const sections = [];
  sections.push({ title:'Summary', columns:['Metric','Value'], rows:[
    ['Total income', fmtN(agg.income)], ['Total expenses', fmtN(agg.expense)], ['Net cash flow', fmtN(agg.net)], ['Savings rate', agg.savingsRate.toFixed(1)+'%'],
    ['Card purchases (in expenses)', fmtN(agg.cardSpend)], ['Net worth (end)', fmtN(L.netWorth)], ['Net worth change', fmtN(L.netWorth - Lstart.netWorth)] ] });
  sections.push({ title:'Income report', columns:['Source','Amount','Share'], rows: Object.entries(agg.incByCat).sort((a,b)=>b[1]-a[1]).map(([c,v]) => [c, fmtN(v), (v/agg.income*100).toFixed(1)+'%']) });
  sections.push({ title:'Expense report by category', columns:['Category','Amount','Share'], rows: Object.entries(agg.byCat).sort((a,b)=>b[1]-a[1]).map(([c,v]) => [c, fmtN(v), (v/agg.expense*100).toFixed(1)+'%']) });
  sections.push({ title:'Cash flow analysis', columns:['Month','Income','Expenses','Net','Savings rate'], rows: P.months.map(m => { const a = monthAgg(S, m); return [ymLabel(m), fmtN(a.income), fmtN(a.expense), fmtN(a.net), a.income ? a.savingsRate.toFixed(1)+'%' : '—']; }) });
  const contrib = S.tx.filter(t => t.date >= P.from && t.date <= P.to);
  sections.push({ title:'Savings report', columns:['Goal','Contributed in period','Balance','Target','Progress'], rows: S.goals.map(g => { const c = sum(contrib.filter(t=>t.goalId===g.id).map(t => t.type==='goal_withdraw' ? -t.amount : +t.amount)); const s = L.goal[g.id]||0; return [g.name, fmtN(c), fmtN(s), fmtN(+g.target), (g.target ? s/g.target*100 : 0).toFixed(0)+'%']; }) });
  sections.push({ title:'Debt report', columns:['Liability','Type','Outstanding','Paid in period','Interest/profit paid'], rows: [
    ...S.cards.map(c => [`${c.bank} ${c.name}`, 'Credit card', fmtN(Math.max(0,L.card[c.id]||0)), fmtN(sum(contrib.filter(t=>t.type==='card_payment'&&t.cardId===c.id).map(t=>t.amount))), '—']),
    ...S.loans.map(l => { const ps = contrib.filter(t=>t.type==='loan_payment'&&t.loanId===l.id); return [`${l.lender} ${l.name}`, 'Loan', fmtN(L.loan[l.id]||0), fmtN(sum(ps.map(t=>t.amount))), fmtN(sum(ps.map(t=>L.interestByTx[t.id]||0)))]; }),
    ['Total', '', fmtN(L.debt), '', ''] ] });
  sections.push({ title:'Credit card utilisation', columns:['Card','Limit','Balance','Utilisation','Spend in period','Cashback (est.)'], rows: S.cards.map(c => { const sp = sum(contrib.filter(t=>t.type==='expense'&&t.cardId===c.id).map(t=>t.amount)); const b = Math.max(0, L.card[c.id]||0); return [`${c.bank} ${c.name}`, fmtN(+c.limit), fmtN(b), (c.limit ? b/c.limit*100 : 0).toFixed(1)+'%', fmtN(sp), fmtN(sp*(+c.cashback||0)/100)]; }) });
  const Lnow = ledger(S);
  sections.push({ title:'Investment performance (current prices)', columns:['Asset','Class','Qty','Cost','Value','Unrealised P/L','Realised P/L'], rows: Lnow.holdings.filter(h => h.qty > 0 || h.realized).map(h => [`${h.asset.name}${h.asset.ticker?' ('+h.asset.ticker+')':''}`, h.asset.cls, +h.qty.toFixed(4), fmtN(h.costAED), fmtN(h.value), `${fmtN(h.unrealized)} (${h.unrealizedPct.toFixed(1)}%)`, fmtN(h.realized)]) });
  sections.push({ title:'Net worth report (end of period)', columns:['Item','Amount'], rows: [
    ['Cash & bank accounts', fmtN(L.cash)], ['Savings accounts', fmtN(L.savingsAcc)], ['Savings goals', fmtN(L.goals)], ['Investments (current prices)', fmtN(L.invValue)],
    ['Total assets', fmtN(L.assets)], ['Credit cards', fmtN(-L.cardDebt)], ['Loans', fmtN(-L.loanDebt)], ['Total liabilities', fmtN(-L.liabilities)], ['Net worth', fmtN(L.netWorth)] ] });
  return { P, agg, sections };
}

/* ---- Facts snapshot for the assistant (real data only) ---- */

    budgets: B.rows.map(r => ({ category:r.cat, limit:r2(r.effective), spent:r2(r.spent), pctUsed:r2(r.pct) })),

/* ---- Deterministic answers ---- */
function answer(S, ym, q, fmt) {
  q = q.toLowerCase(); const L = ledger(S); const m = monthAgg(S, ym);
  const top = (obj, n=3) => Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);
  if (/net ?worth/.test(q)) return `Your net worth is ${fmt(L.netWorth)}: assets of ${fmt(L.assets)} (cash ${fmt(L.cash)}, savings ${fmt(L.totalSavings)}, investments ${fmt(L.invValue)}) minus liabilities of ${fmt(L.liabilities)}.`;
  if (/afford|new loan/.test(q)) { const D = dti(S, L, ym); const cap = D.income * 0.5; const room = cap - D.total;
    return `Your monthly debt payments are ${fmt(D.total)} (${D.ratio.toFixed(1)}% of ${fmt(D.income)} income). UAE Central Bank rules cap total debt payments at 50% of salary, which leaves room for about ${fmt(Math.max(0,room))} of new monthly EMI. ${room <= 0 ? 'You are already at or above that limit, so a new loan is not advisable.' : D.ratio > 35 ? 'You are above 35% already, so a new loan would stretch your budget; consider paying down card debt first.' : 'Keep a buffer: a total ratio under 35% is more comfortable.'} Your emergency cover is ${healthScore(S,L,ym).efMonths.toFixed(1)} months of expenses.`; }
  if (/debt|owe/.test(q)) return `You owe ${fmt(L.debt)} in total: ${fmt(L.cardDebt)} on credit cards and ${fmt(L.loanDebt)} in loans. ` + S.loans.map(l => { const li = loanInfo(S,L,l); return `${l.lender} ${l.name}: ${fmt(li.out)}, debt-free by ${li.debtFree}.`; }).join(' ');
  if (/biggest|largest|top/.test(q)) { const big = S.tx.filter(t => isExpenseTx(t) && inCycle(t, ym)).sort((a,b)=>b.amount-a.amount).slice(0,3);
    return `Biggest categories in ${ymLong(ym)}: ${top(m.byCat).map(([c,v])=>`${c} ${fmt(v)}`).join(', ')}. Largest single expenses: ${big.map(t=>`${t.payee||t.notes||expCat(t)} ${fmt(t.amount)} (${t.date})`).join(', ') || 'none'}.`; }
  if (/how much should i save|save every month|each month/.test(q)) { const need = S.goals.map(g => ({ g, i: goalInfo(S,L,g) })).filter(x => x.i.required > 0);
    return need.length ? `To hit every goal on time you need ${fmt(sum(need.map(x=>x.i.required)))} a month: ${need.map(x=>`${x.g.name} ${fmt(x.i.required)}`).join(', ')}.` : 'No goals with a target date and remaining balance. Add a goal to get a monthly figure.'; }
  if (/safely save|can i save|safe to save/.test(q)) { const a = avgMonthly(S, ym, 3); const surplus = a.income - a.expense; const safe = Math.max(0, surplus - a.income*0.05);
    return `Over the last 3 months you averaged ${fmt(a.income)} income and ${fmt(a.expense)} expenses, a surplus of ${fmt(surplus)}. Keeping a 5% of income buffer for irregular costs, you can safely save about ${fmt(safe)} a month.`; }
  if (/subscri|netflix|noon|careem|prime/.test(q)) { const act = (S.subs||[]).filter(subActive); if (!act.length) return 'No subscriptions recorded yet. Add them on the Subscriptions page.';
    const mo = sum(act.map(s => subMonthly(S, s))); return `You have ${act.length} active subscriptions costing about ${fmt(mo)} a month (${fmt(mo*12)} a year). Next charges: ${act.filter(s=>s.next).sort((a,b)=>a.next.localeCompare(b.next)).slice(0,4).map(s => `${s.name} ${fmt(subAED(S,s))} on ${s.next}`).join(', ')}.`; }
  if (/spend|spent/.test(q)) return `You spent ${fmt(m.expense)} in ${ymLong(ym)} against ${fmt(m.income)} income. Top categories: ${top(m.byCat).map(([c,v])=>`${c} ${fmt(v)}`).join(', ') || 'none yet'}.`;
  if (/income|earn/.test(q)) return `Income in ${ymLong(ym)}: ${fmt(m.income)} — ${top(m.incByCat,5).map(([c,v])=>`${c} ${fmt(v)}`).join(', ')}.`;
  return null;
}

  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, ms);
}
function modal(title, body, { wide = false, foot = '' } = {}) {

/* ---------- persistence ---------- */
const IS_PWA = !!window.__PWA__;
const idb = (() => { let dbp; const open = () => dbp ||= new Promise((res, rej) => { const r = indexedDB.open('dirhamwise', 1); r.onupgradeneeded = () => r.result.createObjectStore('att'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('att', mode); const st = t.objectStore('att'); const q = fn(st); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx('readonly', st => st.get(k)), set: (k, v) => tx('readwrite', st => st.put(v, k)), del: k => tx('readwrite', st => st.delete(k)) }; })();
const PST = { mode:'local', db:null, uid:null, saved:{}, timer:null, busy:false, again:false, status:'', err:null };
const LS_KEY = 'uae_fin_state_v1';
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } };

const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
async function initPersistence() {
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const [db, user] = await withTimeout(Promise.all([claude.use('db'), claude.use('user')]), 10000) || [];
      if (db && user) { const id = await withTimeout(user.id(), 8000); if (id) { PST.db = db; PST.uid = id; PST.mode = 'cloud'; } }
    } catch(e) { PST.err = e; }
  }
}
const docRef = k => PST.db.doc(`data/users/${PST.uid}/${k}`);
function splitDocs(state) {
  const { tx, ...core } = state; const shards = {};
  for (const t of tx) { const { attachment, ...rest } = t; (shards['fin_tx_' + t.date.slice(0,7)] ||= []).push(rest); }
  const out = { fin_core: JSON.stringify({ ...core, shards: Object.keys(shards).sort() }) };
  for (const [k, v] of Object.entries(shards)) out[k] = JSON.stringify(v);
  return out;
}
async function loadState() {
  if (PST.mode === 'cloud') {
    try {
      const snap = await withTimeout(docRef('fin_core').get(), 10000);
      if (snap === null) throw { code:'timeout' };
      if (!snap.exists) return null;
      const core = JSON.parse(snap.data().json); PST.saved.fin_core = snap.data().json;
      const shards = await Promise.all((core.shards || []).map(k => docRef(k).get().then(s => [k, s.exists ? s.data().json : '[]'])));
      const tx = []; for (const [k, j] of shards) { PST.saved[k] = j; tx.push(...JSON.parse(j)); }
      delete core.shards; return { ...core, tx };
    } catch(e) { console.warn('cloud load failed', e); PST.mode = 'local'; PST.err = e; toast('Could not reach your cloud data; working in this browser for now.', 'warn', 6000); }
  }

}
function scheduleSave() { clearTimeout(PST.timer); setSync('Saving…'); PST.timer = setTimeout(flushSave, 600); }
async function flushSave() {
  if (PST.busy) { PST.again = true; return; }
  PST.busy = true;
  try {
    if (PST.mode === 'cloud') {
      const docs = splitDocs(S);
      for (const k of Object.keys(PST.saved)) if (!(k in docs) && k.startsWith('fin_tx_') && PST.saved[k] !== '[]') docs[k] = '[]';
      for (const [k, j] of Object.entries(docs)) {
        if (PST.saved[k] === j) continue;
        try { await docRef(k).set({ json: j, at: Date.now() }); PST.saved[k] = j; }
        catch(e) { if (e?.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random()*800)); await docRef(k).set({ json: j, at: Date.now() }); PST.saved[k] = j; } else throw e; }
      }

      setSync(lsSet(LS_KEY, JSON.stringify(S)) ? 'Saved on this device' : 'Not saved', 'loc');

  } catch(e) {
    console.error(e); setSync('Save failed', 'loc');
    toast(e?.code === 'quota_exceeded' ? 'Storage is full. Export a backup and delete old data.' : 'Could not save your latest change. It will retry on the next change.', 'bad', 6000);

/* ---------- downloads ---------- */
async function offerDownload(filename, data, textFallback) {
  if (IS_PWA) {
    const mime = { csv:'text/csv', json:'application/json', pdf:'application/pdf', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }[filename.split('.').pop()] || 'application/octet-stream';
    const file = new File([data], filename, { type: mime });
    if (/iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare?.({ files:[file] })) { try { await navigator.share({ files:[file], title: filename }); return; } catch(e) { if (e?.name === 'AbortError') return; } }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast('Saved ' + filename); return; } catch(e) {}
  }
  try {
    const dl = window.claude?.use ? await withTimeout(claude.use('downloads'), 4000) : null;
    if (dl) { await dl.save({ filename, data }); toast('File ready: ' + filename); return; }
  } catch(e) { if (e?.code === 'declined') return; if (e?.code && e.code !== 'unavailable' && e.code !== 'not_granted') { toast('Download failed: ' + (e.message || e.code), 'bad'); return; } }
  try { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); } catch(e) {}
  if (textFallback) { modal('Copy your export', `<p class="mut" style="margin-top:0">If the download did not start, copy the contents below.</p><textarea class="inp" rows="12" readonly id="cpy">${esc(textFallback)}</textarea>`, { foot:'<span class="sp"></span><button class="btn pri" id="cpyb">Copy</button>' }); $('#cpyb').onclick = async () => { try { await navigator.clipboard.writeText(textFallback); toast('Copied'); } catch(e) { $('#cpy').select(); toast('Select all and copy manually', 'warn'); } }; }
}

  const x = c.getContext('2d'); x.scale(devicePixelRatio, devicePixelRatio); const cols = ['#7C6CFF','#22D3EE','#F59E0B','#22C55E','#F43F5E','#E879F9'];

    for (const p of P) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - t / 2200); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }

}

  if (r === 'year') return [V.ym.slice(0,4) + '-01-01', V.ym.slice(0,4) + '-12-31'];

function filteredTx() {

    if (tab === 'income' && t.type !== 'income') return false;
    if (tab === 'expense' && !isExpenseTx(t)) return false;
    if (tab === 'moves' && ['income','expense','loan_payment'].includes(t.type)) return false;
    if (tab === 'recurring' && !t.recurring) return false;

    if (acct && t.accountId !== acct && t.cardId !== acct && t.toAccountId !== acct) return false;
    if (qq && !`${t.payee} ${t.notes} ${t.category} ${t.amount} ${TX_TYPES[t.type]}`.toLowerCase().includes(qq)) return false;
    return true;

}

    S.settings[k] = v; if (k === 'cycleDay') { setCycleDay(v); V.ym = cycleOf(todayISO()); } commit('Settings saved'); });
  $$('.srate').forEach(el => el.onchange = () => { const v = +el.value; if (!(v > 0)) return toast('Enter a positive rate', 'bad'); S.settings.rates[el.dataset.c] = v; commit('Rate updated'); });
  $('#restoreFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const o = JSON.parse(await f.text()); if (!o || !Array.isArray(o.tx) || !o.settings) throw 0;
    confirmBox(`Replace all current data with this backup (${o.tx.length} transactions)?`, () => { S = Object.assign(emptyState(), o); S.settings = Object.assign(emptyState().settings, o.settings); V.ym = (setCycleDay(S.settings.cycleDay||1), cycleOf(todayISO())); commit('Backup restored'); }, 'Restore'); } catch(err) { toast('That file is not a valid backup', 'bad'); } };
};

/* ---------- actions ---------- */
/* ---------- app lock & install (installed-app build) ---------- */
const LOCK_KEY = 'uae_fin_pin';
const lockHash = () => lsGet(LOCK_KEY);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
async function sha(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dirhamwise:' + t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function pinScreen(onOk) {
  document.body.innerHTML = `<div class="onb" style="max-width:340px"><div class="logo" style="width:56px;height:56px;font-size:24px;margin:0 auto;border-radius:18px">D</div><h2 style="font-size:22px">Enter your PIN</h2>
  <form id="pinf"><input class="inp" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="text-align:center;font-size:24px;letter-spacing:10px;margin:14px 0"><button class="btn pri" style="width:100%;justify-content:center;padding:12px">Unlock</button></form>
  <p class="hint" style="margin-top:16px">Forgot it? <a href="#" id="forgot">Reset the app</a> (erases data on this device; restore from a backup).</p></div>`;
  $('#pin').focus(); let tries = 0;
  $('#pinf').onsubmit = async e => { e.preventDefault(); if (await sha($('#pin').value) === lockHash()) onOk(); else { tries++; $('#pin').value = ''; toast(tries >= 5 ? 'Wrong PIN. Wait a moment before trying again.' : 'Wrong PIN', 'bad'); if (tries >= 5) { $('#pin').disabled = true; setTimeout(() => { $('#pin').disabled = false; tries = 0; }, 30000); } } };
  $('#forgot').onclick = e => { e.preventDefault(); confirmBox('Erase all data on this device and remove the PIN?', () => { lsDel(LS_KEY); lsDel(LOCK_KEY); location.reload(); }, 'Erase & reset'); };
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
function installHelp() {
  if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; }); return; }
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  modal('Install DirhamWise', ios ? `<ol style="line-height:1.9;padding-left:20px;margin:0"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>` : `<ol style="line-height:1.9;padding-left:20px;margin:0"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu.</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>`);
}

const ACT = {
  catAll: () => { V.catAll = !V.catAll; render(); },
  catDrill: d => { V.money = { ...V.money, tab:'expense', cat: d.cat, range:'month', q:'', acct:'' }; go('money'); },
  syncCard: d => { const c = S.cards.find(x => x.id === d.id); const ci = cardInfo(S, ledger(S), c); const target = (+c.limit || 0) - c.bankAvail.amount; const delta = r2(target - ci.bal);
    confirmBox(`Set the ${c.bank} ${c.name} balance to ${fmt(target)} so available credit matches your bank (${fmt(c.bankAvail.amount)})? This adjusts the opening balance by ${fmt(delta, { sign:true })}; your transactions stay as they are.`, () => { c.opening = r2((+c.opening || 0) + delta); commit('Card balance matched to bank'); }, 'Match bank'); },
  smsFile: () => $('#smsfile').click(), smsMore: () => { SMSV.show = (SMSV.show || 100) + 100; render(); },
  smsAll: d => { for (const x of SMSV.items) x.on = d.v === '1' && x.p.ok && x.dup?.type !== 'same'; render(); },
  smsRead: () => { SMSV.lastFile = null; smsAnalyse($('#smsin').value); render(); if (!SMSV.items.length) toast('Paste at least one SMS', 'warn'); },
  smsClear: () => { SMSV.text = ''; SMSV.items = []; SMSV.lastFile = null; render(); },
  smsPaste: async () => { try { const t = await navigator.clipboard.readText(); smsAnalyse((SMSV.text ? SMSV.text + '\n\n' : '') + t); render(); } catch(e) { toast('Clipboard access was blocked. Long-press the box and paste instead.', 'warn'); } },
  smsImport: () => { const sel = SMSV.items.filter(x => x.on && x.p.ok); if (sel.some(x => (x.p.kind === 'purchase' || x.p.kind === 'refund') && !x.p.cardId && !x.p.accountId)) return toast('Choose a card or account for every selected message', 'bad');
    const r = smsImportItems(sel.sort((a, b) => (a.p.date || '').localeCompare(b.p.date || ''))); SMSV.text = ''; SMSV.items = []; SMSV.lastFile = null; commit(`Imported ${r.added}${r.merged ? `, confirmed ${r.merged} subscription charge${r.merged > 1 ? 's' : ''}` : ''}${r.skipped ? `, skipped ${r.skipped} duplicate${r.skipped > 1 ? 's' : ''}` : ''}`); go('money'); },
  copyLink: async () => { try { await navigator.clipboard.writeText(smsLink()); toast('Link copied'); } catch(e) { $('#smslink').select(); toast('Select and copy the link', 'warn'); } },
  addSub: () => subForm(), editSub: d => subForm(S.subs.find(x => x.id === d.id)), paySub: d => paySub(d.id),
  subStatus: d => { const s = S.subs.find(x => x.id === d.id); s.status = d.v; if (d.v === 'active' && s.next < todayISO()) { while (s.next < todayISO()) s.next = subAdvance(s.next, s.cycle); } commit(d.v === 'active' ? `${s.name} resumed` : `${s.name} paused`, 'info'); },
  setPin: () => openForm({ title: lockHash() ? 'Change PIN' : 'Set a PIN lock', fields:[ { k:'pin', label:'New PIN (4–8 digits)', type:'password', req:true, validate: v => /^\d{4,8}$/.test(v) ? null : 'Use 4 to 8 digits' }, { k:'pin2', label:'Repeat PIN', type:'password', req:true, validate: (v, o) => v !== o.pin ? 'PINs do not match' : null } ],
    onSubmit: async o => { lsSet(LOCK_KEY, await sha(o.pin)); render(); toast('PIN lock on. You\'ll need it each time you open the app.'); } }),
  removePin: () => confirmBox('Remove the PIN lock?', () => { lsDel(LOCK_KEY); render(); toast('PIN lock removed', 'info'); }, 'Remove'),
  install: () => installHelp(),
  go: d => go(d.p), closeModal, mprev: () => { V.ym = ymAdd(V.ym, -1); render(); }, mnext: () => { V.ym = ymAdd(V.ym, 1); render(); },
  theme: () => { const cur = document.documentElement.dataset.theme; S.settings.theme = cur === 'dark' ? 'light' : 'dark'; commit(); },
  more: () => { const sc = modal('More', `<div class="list">${PAGES.filter(p => !['dashboard','money','subs','cards'].includes(p[0])).map(([k, l]) => `<button class="nav" data-act="go" data-p="${k}" style="padding:13px 10px">${ico(k)}<span>${l}</span></button>`).join('')}</div>`); sc.addEventListener('click', e => { if (e.target.closest('[data-act=go]')) closeModal(); }); },
  addTx: d => txForm(d.type || 'expense', null, d.cat ? { category: d.cat } : {}),
  editTx: d => { const t = S.tx.find(x => x.id === d.id); if (!t) return; if (t.type.startsWith('invest')) tradeForm(null, null, t); else txForm(t.type, t); },
  mtab: d => { V.money.tab = d.v; V.money.cat = ''; V.money.limit = 150; render(); }, moreTx: () => { V.money.limit = (V.money.limit || 150) + 150; render(); },
  addBudget: () => budgetForm(), editBudget: d => budgetForm(d.cat),
  addCard: () => cardForm(), editCard: d => cardForm(S.cards.find(c => c.id === d.id)), payCard: d => payReminder('card', d.id), cardBuy: d => txForm('expense', null, { cardId: d.id, method:'Credit card' }), cardTx: d => cardTxModal(d.id),
  addLoan: () => loanForm(), editLoan: d => loanForm(S.loans.find(l => l.id === d.id)), payLoan: d => payReminder('loan', d.id, todayISO()), schedule: d => scheduleModal(d.id),
  addGoal: () => goalForm(), editGoal: d => goalForm(S.goals.find(g => g.id === d.id)), contrib: d => txForm('goal_contribution', null, { goalId: d.id, amount: S.goals.find(g => g.id === d.id)?.monthly || '' }), withdraw: d => txForm('goal_withdraw', null, { goalId: d.id }),
  addAsset: () => assetForm(), editAsset: d => assetForm(S.assets.find(a => a.id === d.id)), buy: d => tradeForm('buy', d.id), sell: d => tradeForm('sell', d.id), invTab: d => { V.invTab = d.v; render(); },
  price: d => { const a = S.assets.find(x => x.id === d.id); openForm({ title:`Update price · ${a.ticker || a.name}`, values:{ price: a.price }, fields:[{ k:'price', label:`Current price (${a.currency})`, type:'number', req:true, positive:true, hint: a.priceAt ? `Last updated ${a.priceAt}` : '' }], onSubmit: o => { a.price = +o.price; a.priceAt = todayISO(); commit('Price updated'); } }); },
  repKind: d => { V.rep.kind = d.v; V.rep.key = null; render(); }, exp: d => exportReport(d.f),
  ask: d => ask(d.q), addBill: () => billForm(), editBill: d => billForm(S.bills.find(b => b.id === d.id)), payRem: d => payReminder(d.ref, d.id, d.date),
  addAccount: () => accountForm(), editAccount: d => accountForm(S.accounts.find(a => a.id === d.id)),
  backup: () => { const j = JSON.stringify(S, null, 1); offerDownload(`finance-backup-${todayISO()}.json`, j, j); }, restore: () => $('#restoreFile').click(),
  txcsv: () => { const rows = [...S.tx].sort((a,b) => a.date.localeCompare(b.date)).map(t => [t.date, TX_TYPES[t.type], t.category || (t.type === 'loan_payment' ? 'Loan EMI' : ''), `"${String(txTitle(t)).replace(/"/g,'""')}"`, fmtExport(t.amount), `"${(t.cardId ? cardName(t.cardId) : accName(t.accountId)).replace(/"/g,'""')}"`, t.method || '', `"${String(t.notes||'').replace(/"/g,'""')}"`].join(','));
    const csv = `Date,Type,Category,Description,Amount (${curCode()}),Account/Card,Method,Notes\n` + rows.join('\n'); offerDownload(`transactions-${todayISO()}.csv`, csv, csv); },
  demo: () => confirmBox('Replace your current data with realistic UAE sample data?', () => { S = demoState(); setCycleDay(S.settings.cycleDay); V.ym = cycleOf(todayISO()); commit('Sample data loaded'); }, 'Load sample'),
  wipe: () => confirmBox('Erase ALL your financial data? Export a backup first if you might need it.', () => { const keep = { theme: S.settings.theme }; S = emptyState(); Object.assign(S.settings, keep); setCycleDay(1); V.ym = cycleOf(todayISO()); commit('All data erased', 'info'); }, 'Erase everything'),
  startDemo: () => { S = demoState(); startApp('Sample data loaded. Explore, then erase it in Settings when you\'re ready.'); },
  startFresh: () => { S = emptyState(); startApp(); setTimeout(() => accountForm(), 300); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- boot ---------- */
function startApp(msg) {
  const viaSMS = /[?&](sms|text|title)=/.test(location.search);
  setCycleDay(S.settings.cycleDay || 1); V.ym = cycleOf(todayISO());
  const created = generateRecurring(S) + generateSubs(S);
  shell(); V.enter = true; const h = (location.hash || '').slice(1); V.page = PAGES.some(p => p[0] === h) || h === 'sms' ? h : 'dashboard';
  render(); scheduleSave();
  if (msg) toast(msg, 'info', 5000);
  handleIncomingSMS();
  if (created) toast(`${created} recurring transaction${created > 1 ? 's' : ''} added for this period`, 'info');
  const due = viaSMS ? [] : reminders(S, ledger(S), +S.settings.remindDays || 5); if (due.length) setTimeout(() => toast(`${due.length} payment${due.length > 1 ? 's' : ''} due soon: ${due.slice(0,3).map(r => r.title).join(', ')}${due.length > 3 ? '…' : ''}`, 'warn', 6000), 800);
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S && $('#view') && PAGES.some(p => p[0] === h) && h !== V.page) { V.page = h; render(); } });
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (S) { applyTheme(); render(); } });
async function boot() {
  applyTheme();
  if (IS_PWA) {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
    try { PST.persisted = await navigator.storage?.persist?.(); } catch(e) {}
    if (lockHash()) { await new Promise(res => pinScreen(res)); }
    let hidden = 0; document.addEventListener('visibilitychange', () => { if (document.hidden) hidden = Date.now(); else if (lockHash() && hidden && Date.now() - hidden > 120000 && S) { const keep = location.hash; pinScreen(() => { shell(); render(); location.hash = keep; }); } });
  }
  document.body.innerHTML = '<div class="loading"><div style="text-align:center"><div class="logo" style="width:56px;height:56px;font-size:24px;margin:0 auto 18px;border-radius:18px">D</div><div class="spin"></div><div class="mut">Loading your finances…</div></div></div>';
  await initPersistence();
  let st = await loadState();
  if (IS_PWA) PST.mode = 'local';
  if (!st && PST.mode === 'cloud') { const raw = lsGet(LS_KEY); if (raw) try { st = JSON.parse(raw); } catch(e) {} }
  if (st) { S = Object.assign(emptyState(), st); S.settings = Object.assign(emptyState().settings, st.settings || {}); S.settings.rates = Object.assign({ ...DEFAULT_RATES }, S.settings.rates || {}); return startApp(); }
  S = null; applyTheme();
  document.body.innerHTML = `<div class="onb"><div class="logo" style="width:64px;height:64px;font-size:28px;margin:0 auto;border-radius:20px">D</div><div class="floaty"><span>💳</span><span>🎯</span><span>📈</span><span>🔁</span></div><h2>Welcome to DirhamWise</h2><p>Track income, expenses, budgets, credit cards, loans, savings goals and investments in one place, built around life in the UAE: AED by default, salary-cycle budgeting, DEWA/ADDC, Salik and Darb, UAE banks and cards.</p>
  <p style="font-size:13px">${IS_PWA ? '🔒 Your data stays on this device. No account, no server.' : PST.mode === 'cloud' ? '🔒 Your data is stored privately for your account.' : '⚠️ Your data will be saved in this browser.'}</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px"><button class="btn pri" data-act="startDemo" style="padding:12px 20px">Explore with sample data</button><button class="btn" data-act="startFresh" style="padding:12px 20px">Start with my own data</button></div></div>`;
}
boot();
</script>
</body></html>
